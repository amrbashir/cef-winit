[package]
name = "cef-winit"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "cef-winit"

[package.metadata.cef.bundle]
helper_name = "cef-winit-helper"

[[bin]]
name = "cef-winit"
path = "src/main.rs"

[[bin]]
name = "cef-winit-helper"
path = "src/bin/cef_winit_helper.rs"

[dependencies]
cef = { version = "148.4.0", features = ["build-util"] }
winit = "0.31.0-beta.2"

[features]
linux-x11 = ["cef/linux-x11"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", features = [
    "NSObject",
    "NSRunLoop",
    "NSThread",
    "NSTimer",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSView",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.21"
libc = "0.2"
x11-dl = "2"
